<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Centermax Odontologia">
  <title>Centermax Odontologia</title>
  <!-- O emblema: duas figuras humanas que, juntas, desenham um dente.
       O vazio entre elas forma um coração. Redesenhado em vetor a partir
       da logo original da clínica. -->
  <defs>
    <path id="cm-tooth" d="M120 62c-16-16-48-16-63 6-14 21-9 56 1 92 5 19 8 30 15 30s9-11 12-30c4-24 8-38 35-38s31 14 35 38c3 19 5 30 12 30s10-11 15-30c10-36 15-71 1-92-15-22-47-22-63-6Z"/>
    <mask id="cm-tooth-cut">
      <use href="#cm-tooth" fill="#fff"/>
      <use href="#cm-tooth" fill="#000" transform="translate(120 132) scale(.775) translate(-120 -132)"/>
      <!-- abre o alto da silhueta: ali passa o braço da figura da esquerda -->
      <path fill="#000" d="M0 0h126v96H0z"/>
    </mask>
  </defs>

  <!-- corpos: a silhueta do dente, vazada -->
  <g fill="currentColor">
    <use href="#cm-tooth" mask="url(#cm-tooth-cut)"/>
    <!-- cabeças -->
    <circle cx="52" cy="56" r="15"/>
    <ellipse cx="177" cy="42" rx="17" ry="15" transform="rotate(-14 177 42)"/>
    <!-- braços que se encontram no alto do dente -->
    <path d="M58 72c25-4 50 4 68 24l-15 14c-14-16-32-23-53-20Z"/>
    <path d="M170 57c-22 2-40 12-53 29l16 12c10-13 23-21 39-23Z"/>
  </g>

  <!-- o coração desenhado no vazio interno -->
  <path fill="none" stroke="#34a7e0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        d="M120 200c-20-27-32-44-32-61 0-13 9-21 18-21 6 0 11 4 14 10 3-6 8-10 14-10 9 0 18 8 18 21 0 17-12 34-32 61Z"/>
</svg>
